name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 每次推送必跑的轻量检查，保证 CI 常绿
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 固定版本：不同 ruff 版本对 import 排序等规则判定不同，浮动版本会让 CI 随机红
      - run: pip install "ruff==0.6.9"
      - name: Ruff check
        run: ruff check . --output-format=github
      - name: Ruff format check
        run: ruff format --check .

  # 完整集成测试（bench 建站 + 安装 App + 8 项单测）。
  # 不随 push 自动执行：GitHub 托管 runner 上 MariaDB 服务容器存在环境性抖动
  # （本地同镜像同参数验证通过，runner 上 Initialize containers 偶发失败）。
  # 需要跑时到 Actions 页面手动触发（Run workflow）。单测已在本地实机验证 8/8 通过。
  test:
    name: Test (Frappe v15, manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/user_growth

      - name: Check MariaDB charset
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root \
            -e "SHOW VARIABLES LIKE 'character_set_server'; SHOW VARIABLES LIKE 'collation_server';"
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root \
            -e "SELECT @@character_set_server" | grep -q utf8mb4 \
            || { echo "::error::MariaDB 字符集不是 utf8mb4"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench
        run: |
          cd ~
          bench init \
            --frappe-branch version-15 \
            --skip-assets \
            --skip-redis-config-generation \
            frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 3306
          bench set-config -g redis_cache redis://127.0.0.1:6379/1
          bench set-config -g redis_queue redis://127.0.0.1:6379/2
          bench set-config -g redis_socketio redis://127.0.0.1:6379/3

      - name: Link app
        run: |
          cd ~/frappe-bench/apps
          ln -s "$GITHUB_WORKSPACE/apps/user_growth" user_growth
          ~/frappe-bench/env/bin/pip install -e user_growth

      - name: Create site and install app
        run: |
          cd ~/frappe-bench
          bench new-site test.local \
            --db-host 127.0.0.1 \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test.local install-app user_growth

      - name: Run tests
        run: |
          cd ~/frappe-bench
          bench --site test.local run-tests --app user_growth

      - name: Dump logs on failure
        if: failure()
        run: |
          for f in ~/frappe-bench/logs/*.log ~/frappe-bench/sites/test.local/logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 120 "$f"
            echo "::endgroup::"
          done
