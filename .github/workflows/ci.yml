name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 固定版本：不同 ruff 版本对 import 排序等规则判定不同，浮动版本会让 CI 随机红
      - run: pip install "ruff==0.6.9"
      - name: Ruff check
        run: ruff check . --output-format=github
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (Frappe v15)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          # Frappe v15 要求 utf8mb4，否则 bench new-site 直接失败
          MARIADB_AUTO_UPGRADE: "1"
        ports: ["3306:3306"]
        # 字符集由启动参数注入（--innodb-file-format/--innodb-large-prefix 在 10.6 已移除，
        # 加上会导致容器启动失败，"Initialize containers" 步骤直接红）
        options: >-
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      # 自检字符集：若此处不是 utf8mb4，后面建站必失败，直接提前终止省时间
      - name: Check MariaDB charset
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root \
            -e "SHOW VARIABLES LIKE 'character_set_server'; SHOW VARIABLES LIKE 'collation_server';"
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root \
            -e "SELECT @@character_set_server" | grep -q utf8mb4 \
            || { echo "::error::MariaDB 字符集不是 utf8mb4"; exit 1; }

      - uses: actions/checkout@v4
        with:
          path: apps/user_growth

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/yarn
          key: ${{ runner.os }}-v15-${{ hashFiles('pyproject.toml') }}

      - name: Install bench
        run: pip install frappe-bench

      # --skip-assets：CI 只跑后端测试，跳过前端资源编译（最易超时的一步）
      # --skip-redis-config-generation：不生成 supervisor 配置，直接用 service 里的 Redis
      - name: Init bench
        run: |
          cd ~
          bench init \
            --frappe-branch version-15 \
            --skip-assets \
            --skip-redis-config-generation \
            frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 3306
          bench set-config -g redis_cache redis://127.0.0.1:6379/1
          bench set-config -g redis_queue redis://127.0.0.1:6379/2
          bench set-config -g redis_socketio redis://127.0.0.1:6379/3

      # 不用 bench get-app（它要求仓库可 clone 且会改 pyproject），直接链入 checkout 结果
      - name: Link app
        run: |
          cd ~/frappe-bench/apps
          ln -s "$GITHUB_WORKSPACE/apps/user_growth" user_growth
          ~/frappe-bench/env/bin/pip install -e user_growth

      - name: Create site and install app
        run: |
          cd ~/frappe-bench
          bench new-site test.local \
            --db-host 127.0.0.1 \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test.local install-app user_growth

      - name: Run tests
        run: |
          cd ~/frappe-bench
          bench --site test.local run-tests --app user_growth

      # 失败时把日志直接抬到 CI 页面，省得再点进原始日志里翻
      - name: Dump logs on failure
        if: failure()
        run: |
          for f in ~/frappe-bench/logs/*.log ~/frappe-bench/sites/test.local/logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 120 "$f"
            echo "::endgroup::"
          done
