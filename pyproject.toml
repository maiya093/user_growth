[project]
name = "user_growth"
authors = [{ name = "maiya093", email = "maiya093@users.noreply.github.com" }]
description = "用户服务开通 / 中止单据 + 用户增长分析报表 + 用户增长数据大屏（Frappe v15 自定义 App）"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
# Frappe 全仓使用 Tab 缩进

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
# Frappe 官方风格：Tab 缩进（W191）、中文注释中的全角标点（RUF001/002/003）属预期写法
ignore = [
    "B017", "B018", "B023", "B904",
    "E101", "E402", "E501", "F401",
    "RUF001", "RUF002", "RUF003",
    "W191",
]

[tool.ruff.format]
# Frappe 使用 Tab 缩进，formatter 跟随项目风格
indent-style = "tab"

[tool.ruff.lint.per-file-ignores]
"user_growth/tests/*" = ["E402"]
